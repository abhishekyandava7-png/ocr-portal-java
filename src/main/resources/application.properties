# ============================================================
#  Smart Document Digitizer & OCR Portal - Application Config
# ============================================================

spring.application.name=ocr-portal

# ---- H2 File-based Database (persists across restarts) ----
spring.datasource.url=jdbc:h2:file:./data/ocrdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# H2 console for debugging at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Multipart File Upload (20 MB limit) ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---- Tesseract OCR path (Windows default install location) ----
tesseract.data-path=C:/Program Files/Tesseract-OCR/tessdata
tesseract.language=eng

# ---- Upload storage directory ----
app.upload-dir=./uploads

# ---- Server ----
server.port=8080

